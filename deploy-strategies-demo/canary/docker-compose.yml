services:
  stable:
    image: nginx:alpine
    volumes:
      - ./apps/stable:/usr/share/nginx/html:ro
    networks: [demo]

  canary:
    image: nginx:alpine
    volumes:
      - ./apps/canary:/usr/share/nginx/html:ro
    networks: [demo]

  router:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - stable
      - canary
    networks: [demo]

networks:
  demo:

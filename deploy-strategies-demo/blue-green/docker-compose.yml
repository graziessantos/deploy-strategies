services:
  app-blue:
    image: nginx:alpine
    volumes:
      - ./apps/blue:/usr/share/nginx/html:ro
    networks: [demo]

  app-green:
    image: nginx:alpine
    volumes:
      - ./apps/green:/usr/share/nginx/html:ro
    networks: [demo]

  router:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app-blue
      - app-green
    networks: [demo]

networks:
  demo:

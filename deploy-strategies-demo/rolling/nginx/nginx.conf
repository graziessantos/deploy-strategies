events {}

http {
    charset utf-8;

    upstream backend {
        server server1:80;
        server server2:80;
        server server3:80;
        server server4:80;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://backend;
            # desliga cache/keepalive pra forçar round-robin visível a cada refresh
            proxy_set_header Connection "";
        }
    }
}

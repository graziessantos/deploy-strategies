services:
  server1:
    image: nginx:alpine
    volumes:
      - ./apps/server1:/usr/share/nginx/html:ro
    networks: [demo]

  server2:
    image: nginx:alpine
    volumes:
      - ./apps/server2:/usr/share/nginx/html:ro
    networks: [demo]

  server3:
    image: nginx:alpine
    volumes:
      - ./apps/server3:/usr/share/nginx/html:ro
    networks: [demo]

  server4:
    image: nginx:alpine
    volumes:
      - ./apps/server4:/usr/share/nginx/html:ro
    networks: [demo]

  router:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - server1
      - server2
      - server3
      - server4
    networks: [demo]

networks:
  demo:
